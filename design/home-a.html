<title>Ultimate Util Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout concept: variant A (top bar + bookmarks strip + card grid), now high contrast: ink header, solid per-category colors, one featured DOCX card. */
:root{
  --ink:#0b0f19;
  --bg:#eef0f5; --surface:#ffffff; --fg:#0b0f19; --muted:#454d60; --faint:#5d6578;
  --line:#d3d8e3; --line2:#b9c0cf;
  --top-bg:#0b0f19; --top-fg:#ffffff; --top-line:rgba(255,255,255,.16); --top-soft:rgba(255,255,255,.09);
  --accent:#2446f0; --accent-fg:#ffffff; --hl:#8fa6ff;
  --c-docs:#2446f0; --c-media:#d6246e; --c-design:#7440e8; --c-dev:#0a8a66; --c-daily:#c26200; --c-cloud:#0e7490;
  --pop:0 10px 26px rgba(11,15,25,.14);
  --head:'Space Grotesk','Inter',system-ui,sans-serif;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080b12; --surface:#131927; --fg:#f2f4f9; --muted:#aab2c3; --faint:#8f98ab;
    --line:#252d3f; --line2:#37415a;
    --top-bg:#131927; --top-line:#252d3f;
    --pop:0 10px 26px rgba(0,0,0,.55); color-scheme:dark;
  }
  :root:not([data-theme="light"]) .app[data-pal="blue"]{--accent:#8fa6ff;--accent-fg:#0b0f19}
  :root:not([data-theme="light"]) .app[data-pal="lime"]{--accent:#c8f542;--accent-fg:#0b0f19}
  :root:not([data-theme="light"]) .app[data-pal="orange"]{--accent:#ff8a5c;--accent-fg:#0b0f19}
}
:root[data-theme="dark"]{
  --bg:#080b12; --surface:#131927; --fg:#f2f4f9; --muted:#aab2c3; --faint:#8f98ab;
  --line:#252d3f; --line2:#37415a;
  --top-bg:#131927; --top-line:#252d3f;
  --pop:0 10px 26px rgba(0,0,0,.55); color-scheme:dark;
}
:root[data-theme="dark"] .app[data-pal="blue"]{--accent:#8fa6ff;--accent-fg:#0b0f19}
:root[data-theme="dark"] .app[data-pal="lime"]{--accent:#c8f542;--accent-fg:#0b0f19}
:root[data-theme="dark"] .app[data-pal="orange"]{--accent:#ff8a5c;--accent-fg:#0b0f19}

.app[data-pal="blue"]{--accent:#2446f0;--accent-fg:#fff;--hl:#8fa6ff}
.app[data-pal="lime"]{--accent:#0b0f19;--accent-fg:#c8f542;--hl:#c8f542}
.app[data-pal="orange"]{--accent:#e8470f;--accent-fg:#fff;--hl:#ff9a70}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px;border-radius:6px}
.app{min-height:100vh}
.in{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* mockup-only palette switcher */
.mock{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#fff;color:#0b0f19;border-bottom:1px solid #d3d8e3}
.mock .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:7px;padding-bottom:7px}
.mock b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#454d60}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{display:inline-flex;align-items:center;gap:7px;border:1px solid #b9c0cf;background:#fff;color:#0b0f19;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.seg button i{width:12px;height:12px;border-radius:50%;display:inline-block}
.seg button[aria-pressed="true"]{background:#0b0f19;color:#fff;border-color:#0b0f19}

/* header */
.top{background:var(--top-bg);color:var(--top-fg);border-bottom:1px solid var(--top-line)}
.top .in{display:flex;align-items:center;gap:18px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--hl);color:var(--ink);display:grid;place-items:center;font-style:normal;font-size:18px}
.search{position:relative;display:flex;align-items:center;flex:1;max-width:600px}
.search svg{position:absolute;left:13px;font-size:18px;color:#5d6578}
.search input{width:100%;height:44px;border:2px solid transparent;background:#fff;color:#0b0f19;border-radius:12px;padding:0 74px 0 40px;font:500 14px var(--font)}
.search input::placeholder{color:#5d6578}
.search input:focus{outline:none;border-color:var(--hl)}
.search kbd{position:absolute;right:10px;font:700 11px var(--font);color:#454d60;border:1px solid #b9c0cf;border-radius:6px;padding:2px 7px;background:#eef0f5}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1.5px solid var(--top-line);background:var(--top-soft);color:var(--top-fg);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--hl)}
.btn svg{font-size:17px}

/* bookmarks */
.bmbar{background:var(--top-bg);color:var(--top-fg);border-bottom:1px solid var(--top-line)}
.bm{display:flex;align-items:center;gap:12px;min-width:0;padding:9px 0 12px}
.bm-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--hl);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.bm-label svg{font-size:14px;fill:var(--hl)}
.bm-list{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none;min-width:0;flex:1}
.bm-list::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--top-line);background:var(--top-soft);border-radius:999px;height:34px;padding:0 5px 0 4px;white-space:nowrap;font-size:13px;font-weight:600;flex:none}
.chip:hover{border-color:var(--hl)}
.chip .o{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:0 6px 0 0;height:100%}
.chip .dot{width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px}
.chip .x{border:0;background:transparent;width:22px;height:22px;border-radius:50%;color:#aab2c3;font-size:15px;display:grid;place-items:center}
.chip .x:hover{background:rgba(255,255,255,.16);color:#fff}
.bm-empty{color:#aab2c3;font-size:13px}
.bm-note{font-size:12px;color:#aab2c3;white-space:nowrap}

/* page */
main{padding-top:28px}
.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font:700 clamp(28px,4vw,40px)/1.05 var(--head);letter-spacing:-.03em;margin:0 0 6px;text-wrap:balance}
.intro p{margin:0;color:var(--muted);font-size:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--fg);border-radius:999px;padding:5px 14px 5px 6px;font-weight:600;font-size:13px}
.stat b{background:var(--fg);color:var(--bg);border-radius:999px;min-width:28px;height:24px;padding:0 8px;display:grid;place-items:center;font-size:13px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.cats button{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--fg)}
.cats button i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--fg))}
.cats button:hover{border-color:var(--fg)}
.cats button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cats button[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--bg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(222px,1fr));gap:14px}
.card{position:relative;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{border-color:var(--fg);box-shadow:var(--pop);transform:translateY(-2px)}
.card .r1{display:flex;justify-content:space-between;align-items:flex-start}
.ico{width:42px;height:42px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.name{font-family:var(--head);font-weight:600;font-size:16px;letter-spacing:-.01em;line-height:1.25}
.desc{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.cat{font-size:12px;font-weight:600;color:var(--faint)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag svg{font-size:12px}
.tag.local{border:1.5px solid var(--line2);color:var(--muted)}
.tag.cloud{background:var(--fg);color:var(--bg)}
.star{border:0;background:transparent;color:var(--faint);width:32px;height:32px;margin:-4px -6px 0 0;border-radius:9px;display:grid;place-items:center;font-size:18px;flex:none}
.star:hover{background:var(--bg);color:var(--fg)}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] svg{fill:currentColor}

/* featured card */
.card.feat{grid-column:span 2;background:var(--accent);color:var(--accent-fg);border-color:var(--accent);padding:20px;justify-content:space-between;min-height:176px}
.card.feat:hover{border-color:var(--accent);box-shadow:var(--pop)}
.feat .ico{background:var(--accent-fg);color:var(--accent);width:48px;height:48px;font-size:26px}
.feat .name{font-size:22px}
.feat .desc{color:inherit;opacity:.9;font-size:14px;-webkit-line-clamp:3;max-width:34em}
.feat .star{color:inherit;opacity:.85}
.feat .star:hover{background:rgba(255,255,255,.18);color:inherit}
.feat .star[aria-pressed="true"]{color:inherit;opacity:1}
.feat .pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;border:1.5px solid currentColor;border-radius:999px;padding:3px 10px}
.feat .r3{margin-top:0}
.feat .go{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.feat .tag.local{border-color:currentColor;color:inherit}

.empty{border:2px dashed var(--line2);border-radius:14px;padding:40px 16px;text-align:center;color:var(--muted)}
.foot{color:var(--faint);font-size:12.5px;padding-top:34px;padding-bottom:44px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border:1.5px solid var(--hl);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:640px){
  .top .in{gap:10px}
  .signin span,.search kbd,.bm-note{display:none}
  .search input{padding-right:12px}
  .card.feat{grid-column:auto}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.card:hover{transform:none}}
</style>

<div class="mock"><div class="in">
  <b>Color options</b>
  <div class="seg" role="group" aria-label="Choose a palette">
    <button data-pal="blue" aria-pressed="true"><i style="background:#2446f0"></i>Ink + Electric Blue</button>
    <button data-pal="lime" aria-pressed="false"><i style="background:#c8f542;border:1px solid #0b0f19"></i>Ink + Lime</button>
    <button data-pal="orange" aria-pressed="false"><i style="background:#e8470f"></i>Ink + Orange</button>
  </div>
</div></div>

<div class="app" id="app" data-pal="blue"></div>
<div class="toast" id="toast" role="status"></div>

  {id:'json',   cat:'dev',    icon:'braces', name:'JSON / YAML / XML Formatter', desc:'Validate, beautify, minify and diff side by side.'},
  {id:'jwt',    cat:'dev',    icon:'key',    name:'JWT Decoder',            desc:'Inspect token headers and expiry without leaking it.'},
  {id:'regex',  cat:'dev',    icon:'regex',  name:'Regex Tester',           desc:'Live matches with a plain-English token breakdown.'},
  {id:'b64',    cat:'dev',    icon:'hash',   name:'Base64, URL & Hash',     desc:'Encode, decode, and generate MD5, SHA-256, bcrypt.'},
  {id:'cron',   cat:'dev',    icon:'clock',  name:'Cron Parser',            desc:'Read cron in plain words and preview the next 10 runs.'},
  {id:'sql',    cat:'dev',    icon:'db',     name:'SQL & cURL Tools',       desc:'Format SQL, turn cURL into fetch or axios.'},
  {id:'qr',     cat:'daily',  icon:'qr',     name:'QR & Barcode',           desc:'Make Wi-Fi, vCard and URL codes. Scan from webcam.'},
  {id:'units',  cat:'daily',  icon:'ruler',  name:'Unit & Timezone Converter', desc:'Length, weight, data size and world clocks.'},
  {id:'pass',   cat:'daily',  icon:'lock',   name:'Password Generator',     desc:'Random passwords and passphrases with strength meter.'},
  {id:'words',  cat:'daily',  icon:'count',  name:'Word & Reading Counter', desc:'Counts, keyword density and reading time.'},
  {id:'totp',   cat:'cloud',  icon:'shield', cloud:1, name:'2FA Authenticator', desc:'Rotating 6-digit codes, encrypted and backed up.'},
  {id:'notes',  cat:'cloud',  icon:'note',   cloud:1, name:'Secure Notes',      desc:'Encrypted notes and API keys on every device.'},
  {id:'snip',   cat:'cloud',  icon:'code',   cloud:1, name:'Snippet & Prompt Manager', desc:'Code, commands and AI prompts, tagged and searchable.'},
  {id:'saved',  cat:'cloud',  icon:'palette',cloud:1, name:'Saved Palettes & Presets', desc:'Brand colors and favorite softbox lights, anywhere.'},
  {id:'drop',   cat:'cloud',  icon:'clip',   cloud:1, name:'Clipboard & Cross-Device Drop', desc:'Send text, links and small files phone to PC.'},
  {id:'focus',  cat:'cloud',  icon:'timer',  cloud:1, name:'Pomodoro & Habit Tracker', desc:'Focus sessions and streaks tracked over months.'}
];
const byId = Object.fromEntries(T.map(t => [t.id, t]));
const catOf = id => CATS.find(c => c.id === id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const KEY = 'uu-bookmarks', PKEY = 'uu-palette';
let bm;
try { bm = JSON.parse(localStorage.getItem(KEY)); if (!Array.isArray(bm)) throw 0; } catch (e) { bm = ['docx','color','json','qr']; }
bm = bm.filter(id => byId[id]);
const saveBm = () => { try { localStorage.setItem(KEY, JSON.stringify(bm)); } catch (e) {} };
let pal = 'blue';
try { const p = localStorage.getItem(PKEY); if (['blue','lime','orange'].includes(p)) pal = p; } catch (e) {}
let cat = 'all', q = '';
const app = document.getElementById('app');

const badge = t => t.cloud
  ? '<span class="tag cloud" title="Saves to your Google account">' + ic('cloud') + 'Synced</span>'
  : '<span class="tag local" title="Runs 100% in your browser">' + ic('lock') + 'Local</span>';
const star = t => '<button class="star" data-star="' + t.id + '" aria-pressed="' + bm.includes(t.id) + '" aria-label="Bookmark ' + esc(t.name) + '">' + ic('star') + '</button>';

function card(t){
  return '<article class="card" style="--c:' + catOf(t.cat).color + '" data-open="' + t.id + '" tabindex="0">'
    + '<div class="r1"><span class="ico">' + ic(t.icon) + '</span>' + star(t) + '</div>'
    + '<div><div class="name">' + esc(t.name) + '</div><div class="desc">' + esc(t.desc) + '</div></div>'
    + '<div class="r3"><span class="cat">' + esc(catOf(t.cat).name) + '</span>' + badge(t) + '</div></article>';
}
function featured(t){
  return '<article class="card feat" data-open="' + t.id + '" tabindex="0">'
    + '<div class="r1"><span class="ico">' + ic(t.icon) + '</span><span style="display:flex;gap:8px;align-items:center"><span class="pill">New</span>' + star(t) + '</span></div>'
    + '<div><div class="name">' + esc(t.name) + '</div><div class="desc">' + esc(t.desc) + '</div></div>'
    + '<div class="r3"><span class="tag local">' + ic('lock') + 'Local</span><span class="go">Open tool ' + ic('arrow') + '</span></div></article>';
}

function shell(){
  app.dataset.pal = pal;
  app.innerHTML =
    '<header class="top"><div class="in"><div class="logo"><i>' + ic('grid') + '</i>Ultimate Util</div>'
    + '<label class="search">' + ic('search') + '<input id="q" type="search" placeholder="Search 33 tools" autocomplete="off" aria-label="Search tools"><kbd>Ctrl K</kbd></label>'
    + '<span style="flex:1"></span><button class="btn signin">' + ic('user') + '<span>Sign in with Google</span></button></div></header>'
    + '<div class="bmbar"><div class="in"><div class="bm"><span class="bm-label">' + ic('star') + 'Bookmarks</span><div class="bm-list" id="bm"></div><span class="bm-note">Saved in this browser</span></div></div></div>'
    + '<main class="in"><div class="intro"><div><h1>Every tool you need.<br>None of your files uploaded.</h1><p>Fast, private and free. Most tools run right in your browser.</p></div>'
    + '<div class="stats"><span class="stat"><b>27</b>run locally</span><span class="stat"><b>6</b>sync with Google</span></div></div>'
    + '<div class="cats" id="nav"></div><div id="results"></div></main>'
    + '<div class="foot in"><span>Local tools never send your files to a server. Synced tools save to your account after Google login.</span><span>Ctrl K to search from anywhere</span></div>';
  document.getElementById('q').value = q;
  paintNav(); paintBm(); paintResults();
  document.querySelectorAll('[data-pal]').forEach(b => { if (b.closest('.seg')) b.setAttribute('aria-pressed', b.dataset.pal === pal); });
}
function paintNav(){
  const all = [{id:'all', name:'All tools', color:'var(--fg)'}].concat(CATS);
  document.getElementById('nav').innerHTML = all.map(c => '<button style="--c:' + c.color + '" data-cat="' + c.id + '" aria-pressed="' + (cat === c.id) + '"><i></i>' + esc(c.name) + '</button>').join('');
}
function paintBm(){
  document.getElementById('bm').innerHTML = bm.length
    ? bm.map(id => { const t = byId[id]; return '<span class="chip" style="--c:' + catOf(t.cat).color + '"><button class="o" data-open="' + id + '"><span class="dot">' + ic(t.icon) + '</span>' + esc(t.name) + '</button><button class="x" data-rm="' + id + '" aria-label="Remove ' + esc(t.name) + ' from bookmarks">×</button></span>'; }).join('')
    : '<span class="bm-empty">Star a tool and it appears here for one-click access.</span>';
}
function paintResults(){
  const s = q.trim().toLowerCase();
  const items = T.filter(t => (cat === 'all' || t.cat === cat) && (!s || (t.name + ' ' + t.desc + ' ' + catOf(t.cat).name).toLowerCase().includes(s)));
  const el = document.getElementById('results');
  if (!items.length) { el.innerHTML = '<div class="empty">No tool matches “' + esc(q) + '”. Try a shorter word like “pdf” or “color”.</div>'; return; }
  const showFeat = !s && (cat === 'all' || cat === 'docs');
  el.innerHTML = '<div class="grid">' + items.map(t => (showFeat && t.id === 'docx') ? featured(t) : card(t)).join('') + '</div>';
}

let tt;
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 1900); }
document.addEventListener('click', e => {
  const p = e.target.closest('.seg [data-pal]'); if (p) { pal = p.dataset.pal; try { localStorage.setItem(PKEY, pal); } catch (er) {} shell(); return; }
  const s = e.target.closest('[data-star]');
  if (s) { const id = s.dataset.star; bm = bm.includes(id) ? bm.filter(x => x !== id) : bm.concat(id); saveBm(); paintBm(); paintResults(); toast(bm.includes(id) ? 'Added to bookmarks' : 'Removed from bookmarks'); return; }
  const r = e.target.closest('[data-rm]'); if (r) { bm = bm.filter(x => x !== r.dataset.rm); saveBm(); paintBm(); paintResults(); return; }
  const c = e.target.closest('[data-cat]'); if (c) { cat = c.dataset.cat; paintNav(); paintResults(); return; }
  const o = e.target.closest('[data-open]'); if (o) { toast('Mockup only. This would open ' + byId[o.dataset.open].name); return; }
  if (e.target.closest('.signin')) toast('Mockup only. This would start Google login');
});
document.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value; paintResults(); } });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const i = document.getElementById('q'); i.focus(); i.select(); return; }
  if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById('q').focus(); return; }
  if (e.key === 'Enter' && document.activeElement.matches('.card')) document.activeElement.click();
});
shell();
</script>
